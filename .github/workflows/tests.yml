name: Tests

on:
  push:
    branches: [master, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      # Ruff version comes from uv.lock, same as local `uv run ruff`
      - name: Ruff
        run: uv run --locked ruff check --output-format=github .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false

      # --locked fails if uv.lock is out of date with pyproject.toml. Runtime dependencies
      # come from pyproject.toml, so a missing one (e.g. cssselect) fails the tests here.
      - name: Install package and dev dependency group
        run: uv sync --locked

      - name: Pytest
        run: uv run --locked pytest -q --cov=newsfetch --cov-report=term-missing:skip-covered

      - name: Fixture benchmark
        run: uv run --locked python benchmarks/run_benchmark.py

  lowest-deps:
    name: test (lowest dependency versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: false

      # Verifies the ">=" lower bounds in pyproject.toml are actually sufficient
      - name: Install minimum runtime dependencies
        run: |
          uv venv --clear
          uv pip install --resolution lowest-direct .
          uv pip install pytest
          uv pip list

      - name: Pytest
        run: .venv/bin/python -m pytest -q

  package:
    name: wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Build sdist and wheel
        run: |
          uv build
          uvx twine check --strict dist/*

      # Install the built wheel into a clean venv and run it from outside the
      # repo, so nothing is imported from the source tree.
      - name: Install wheel in a clean environment and run the CLI
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl
          cp tests/fixtures/html/rich_article.html "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          ./smoke/bin/news-fetch --version
          ./smoke/bin/news-fetch get --html rich_article.html --json https://www.example.com/news/x > out.json
          ./smoke/bin/python - <<'EOF'
          import json
          import newsfetch

          assert "site-packages" in newsfetch.__file__, newsfetch.__file__
          data = json.load(open("out.json", encoding="utf-8"))
          assert data["title"] == "City Council Approves Transit Plan", data["title"]
          assert data["confidence"]["overall"] > 0.5, data["confidence"]
          assert data["markdown"], "markdown output missing"
          print("wheel OK:", newsfetch.__version__, data["title"])
          EOF
